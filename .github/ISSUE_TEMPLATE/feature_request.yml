---
name: Feature request
description: Propose a production-oriented platform capability
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the operational problem or limitation.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      placeholder: |
        - Implementation
        - Validation
        - Documentation
        - Recovery or rollback
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and operational impact
      description: Include security, availability and compatibility risks.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: This request adds production value.
          required: true
        - label: I searched existing issues.
          required: true