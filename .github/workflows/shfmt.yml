---
name: shfmt

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shfmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check shell formatting
        run: |
          docker run --rm \
            -v "$PWD:/mnt" \
            mvdan/shfmt:v3.12.0 \
            -d -i 2 -ci -bn \
            /mnt/bootstrap \
            /mnt/scripts \
            /mnt/validation \
            /mnt/backup \
            /mnt/operations
