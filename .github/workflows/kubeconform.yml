---
name: kubeconform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kubeconform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          version="0.7.0"

          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" |
            tar -xz

          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Render native Kubernetes manifests
        run: |
          mkdir -p /tmp/rendered

          kubectl kustomize cluster/namespaces \
            > /tmp/rendered/namespaces.yaml

          kubectl kustomize cluster/network \
            > /tmp/rendered/network.yaml

      - name: Validate native Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /tmp/rendered
