---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 30m
  timeout: 15m

  chart:
    spec:
      chart: velero
      version: 10.1.2
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true

  values:
    snapshotsEnabled: false
    deployNodeAgent: true

    credentials:
      useSecret: true
      existingSecret: velero-credentials

    configuration:
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: k8s-platform-backups
          default: true
          accessMode: ReadWrite
          config:
            region: minio
            s3ForcePathStyle: "true"
            s3Url: http://minio.storage.svc.cluster.local:9000

    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.13.0
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - name: plugins
            mountPath: /target

    schedules:
      daily-platform-backup:
        disabled: false
        schedule: "0 2 * * *"
        useOwnerReferencesInBackup: false
        template:
          ttl: 336h
          includedNamespaces:
            - platform-system
            - observability
            - cert-manager
            - traefik-system
            - metallb-system
            - kyverno
          snapshotVolumes: false
          defaultVolumesToFsBackup: true
          storageLocation: default

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    nodeAgent:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
