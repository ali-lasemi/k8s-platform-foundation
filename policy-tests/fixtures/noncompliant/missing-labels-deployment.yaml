---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-labels-deployment
  namespace: platform-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: application
          image: nginx:1.27.4
