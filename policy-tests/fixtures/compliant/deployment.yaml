---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliant-deployment
  namespace: platform-system
  labels:
    app.kubernetes.io/name: compliant-deployment
    app.kubernetes.io/managed-by: flux
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: compliant-deployment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compliant-deployment
        app.kubernetes.io/managed-by: flux
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: nginx:1.27.4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
