---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kubernetes-security-baseline

policies:
  - ../security/policies/kyverno/disallow-privileged.yaml
  - ../security/policies/kyverno/disallow-host-path.yaml
  - ../security/policies/kyverno/disallow-host-namespaces.yaml
  - ../security/policies/kyverno/disallow-latest-tag.yaml
  - ../security/policies/kyverno/require-resources.yaml
  - ../security/policies/kyverno/require-read-only-root-filesystem.yaml
  - ../security/policies/kyverno/disable-service-account-token.yaml
  - ../security/policies/kyverno/require-non-root.yaml
  - ../security/policies/kyverno/require-seccomp.yaml
  - ../security/policies/kyverno/drop-capabilities.yaml
  - ../security/policies/kyverno/require-standard-labels.yaml

resources:
  - fixtures/compliant/pod.yaml
  - fixtures/compliant/deployment.yaml
  - fixtures/noncompliant/privileged-pod.yaml
  - fixtures/noncompliant/host-path-pod.yaml
  - fixtures/noncompliant/host-namespace-pod.yaml
  - fixtures/noncompliant/latest-tag-pod.yaml
  - fixtures/noncompliant/missing-resources-pod.yaml
  - fixtures/noncompliant/writable-root-pod.yaml
  - fixtures/noncompliant/service-account-token-pod.yaml
  - fixtures/noncompliant/missing-labels-deployment.yaml

variables: values.yaml

results:
  - policy: disallow-privileged-containers
    rule: validate-privileged
    resources:
      - privileged-pod
    kind: Pod
    result: fail

  - policy: disallow-host-path
    rule: validate-host-path
    resources:
      - host-path-pod
    kind: Pod
    result: fail

  - policy: disallow-host-namespaces
    rule: validate-host-namespaces
    resources:
      - host-namespace-pod
    kind: Pod
    result: fail

  - policy: require-resource-requests-and-limits
    rule: validate-resources
    resources:
      - missing-resources-pod
    kind: Pod
    result: fail

  - policy: require-read-only-root-filesystem
    rule: validate-read-only-root-filesystem
    resources:
      - writable-root-pod
    kind: Pod
    result: fail

  - policy: disable-service-account-token-automount
    rule: validate-token-automount
    resources:
      - service-account-token-pod
    kind: Pod
    result: fail

  - policy: require-non-root
    rule: require-run-as-non-root
    resources:
      - compliant-pod
    kind: Pod
    result: pass

  - policy: require-seccomp
    rule: validate-seccomp
    resources:
      - compliant-pod
    kind: Pod
    result: pass

  - policy: drop-linux-capabilities
    rule: require-drop-all
    resources:
      - compliant-pod
    kind: Pod
    result: pass

  - policy: require-resource-requests-and-limits
    rule: validate-resources
    resources:
      - compliant-pod
    kind: Pod
    result: pass

  - policy: require-read-only-root-filesystem
    rule: validate-read-only-root-filesystem
    resources:
      - compliant-pod
    kind: Pod
    result: pass

  - policy: disable-service-account-token-automount
    rule: validate-token-automount
    resources:
      - compliant-pod
    kind: Pod
    result: pass

  - policy: disallow-privileged-containers
    rule: validate-privileged
    resources:
      - compliant-pod
    kind: Pod
    result: pass

  - policy: disallow-host-path
    rule: validate-host-path
    resources:
      - compliant-pod
    kind: Pod
    result: pass

  - policy: disallow-host-namespaces
    rule: validate-host-namespaces
    resources:
      - compliant-pod
    kind: Pod
    result: pass

  - policy: require-standard-labels
    rule: validate-workload-labels
    resources:
      - compliant-deployment
    kind: Deployment
    result: pass

  - policy: require-standard-labels
    rule: validate-workload-labels
    resources:
      - missing-labels-deployment
    kind: Deployment
    result: fail
  - policy: disallow-latest-tag
    rule: validate-image-tag
    resources:
      - latest-tag-pod
    kind: Pod
    result: fail

  - policy: disallow-latest-tag
    rule: validate-image-tag
    resources:
      - compliant-pod
    kind: Pod
    result: pass
