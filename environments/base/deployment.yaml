---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-demo
  namespace: platform-workloads
  labels:
    app.kubernetes.io/name: platform-demo
    app.kubernetes.io/part-of: k8s-platform-foundation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-demo
        app.kubernetes.io/part-of: k8s-platform-foundation
    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: application
          image: traefik/whoami:v1.11.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
