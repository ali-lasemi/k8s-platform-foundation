---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-staging

resources:
  - policy.yaml
  - ../base

nameSuffix: -staging

labels:
  - pairs:
      app.kubernetes.io/environment: staging
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: platform-workloads
    patch: |-
      - op: replace
        path: /metadata/name
        value: platform-staging

  - target:
      kind: Deployment
      name: platform-demo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
