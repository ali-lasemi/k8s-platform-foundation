---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  timeout: 10m

  chart:
    spec:
      chart: cert-manager
      version: v1.19.5
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true

  values:
    replicaCount: 2

    prometheus:
      enabled: true
      servicemonitor:
        enabled: false

    webhook:
      replicaCount: 2

    cainjector:
      replicaCount: 2

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi

    webhookResources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi

    cainjectorResources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi

    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault