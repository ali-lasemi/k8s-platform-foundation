---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flagger-system
spec:
  interval: 30m
  timeout: 10m

  chart:
    spec:
      chart: flagger
      version: 1.40.0
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true

  values:
    meshProvider: traefik
    metricsServer: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
    selectorLabels: app.kubernetes.io/name
    logLevel: info

    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
