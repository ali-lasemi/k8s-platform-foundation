---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: encrypted-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-foundation

  interval: 10m
  retryInterval: 1m
  timeout: 5m
  wait: true
  prune: true

  sourceRef:
    kind: GitRepository
    name: k8s-platform-foundation

  path: ./secrets

  decryption:
    provider: sops
    secretRef:
      name: sops-age
