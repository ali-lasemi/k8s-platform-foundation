---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-foundation

  interval: 10m
  retryInterval: 1m
  timeout: 20m
  wait: true
  prune: true

  sourceRef:
    kind: GitRepository
    name: k8s-platform-foundation

  path: ./observability

  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kube-prometheus-stack-operator
      namespace: observability

    - apiVersion: apps/v1
      kind: Deployment
      name: kube-prometheus-stack-grafana
      namespace: observability
