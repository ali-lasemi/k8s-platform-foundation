---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-demo
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-foundation
    - name: external-dns

  interval: 10m
  retryInterval: 1m
  timeout: 10m
  wait: true
  prune: true

  sourceRef:
    kind: GitRepository
    name: k8s-platform-foundation

  path: ./examples/ingress-demo

  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ingress-demo
      namespace: ingress-demo
