---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: environment-staging
  namespace: flux-system
spec:
  dependsOn:
    - name: environment-dev

  interval: 10m
  retryInterval: 1m
  timeout: 10m
  wait: true
  prune: true

  sourceRef:
    kind: GitRepository
    name: k8s-platform-foundation

  path: ./environments/staging
