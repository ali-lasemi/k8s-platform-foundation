---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-foundation
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  wait: true
  prune: true

  sourceRef:
    kind: GitRepository
    name: k8s-platform-foundation

  path: ./clusters/homelab

  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager

    - apiVersion: apps/v1
      kind: Deployment
      name: traefik
      namespace: traefik-system
