---
apiVersion: v1
kind: Pod
metadata:
  name: latest-tag-test
  namespace: security-validation
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: busybox:latest
      command:
        - sleep
        - "3600"
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
