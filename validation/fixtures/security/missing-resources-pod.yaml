---
apiVersion: v1
kind: Pod
metadata:
  name: missing-resources-test
  namespace: security-validation
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: busybox:1.36.1
      command:
        - sleep
        - "3600"
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
